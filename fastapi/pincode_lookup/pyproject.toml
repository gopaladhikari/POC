[project]
name = "pincode-lookup"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "gopaladhikari", email = "gopuadks@gmail.com" }]
requires-python = ">=3.14"
dependencies = ["fastapi[standard]>=0.141.1"]

[project.scripts]
