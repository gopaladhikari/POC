[project]
name = "rag-queue"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "gopaladhikari", email = "gopuadks@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.5.1",
    "langchain-qdrant>=1.1.0",
    "openai>=3.2.0",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.3",
    "reportlab>=5.0.0",
    "rq>=2.11.0",
]

[project.scripts]
start = "rag_queue.main:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
